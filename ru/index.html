<script>
/* Ҳамаи контенти динамикии саҳифаи асосӣ дар як функсия — то ҳангоми
   иваз шудани забон фавран аз нав сохта шавад (бе reload). */

function renderLatest(){
  const grid = document.getElementById('latest-grid');
  if (grid) grid.innerHTML = listings.slice(0, 12).map(renderCard).join('');
}

/* Placeholder-и ҷустуҷӯ бо шумораи эълонҳо — мисли сомон.тҷ.
   Матни воридкардаи корбар нигоҳ дошта мешавад. */
function renderSearchPlaceholder(){
  const inp = document.querySelector('.search-box input[name="q"]');
  if (!inp) return;
  inp.placeholder = t('ph.searchCount', { n: formatNumber(allListings().length) });
  inp.setAttribute('aria-label', t('ph.search'));
}

/* Рубрикаҳо — дар мобилӣ 5 адад + «Ҳамаи рубрикаҳо», дар компютер ҳамаашон */
function renderHomeCatGrid(){
  const homeGrid = document.getElementById('home-cat-grid');
  if (!homeGrid) return;
  const card = c => `
      <a href="category.html?slug=${c.slug}" class="cat-card">
        <div class="cat-icon" aria-hidden="true">${iconHTML(catIcons[c.slug] || 'wrench')}</div>
        <div class="cat-name">${c.name}</div>
      </a>`;
  const isMobile = window.innerWidth < 768;
  let html = (isMobile ? categories.slice(0, 5) : categories).map(card).join('');
  if (isMobile) {
    html += `<a href="search.html" class="cat-card">
        <div class="cat-icon" aria-hidden="true"><span class="ico" data-icon="layout-grid"></span></div>
        <div class="cat-name">${t('index.allCategories')}</div>
      </a>`;
  }
  homeGrid.innerHTML = html;
}

function renderPage(){
  renderLatest();
  renderSearchPlaceholder();
  renderHomeCatGrid();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderPage);
} else renderPage();

if (window.I18N) I18N.onChange(renderPage);

let _catGridResizeT;
window.addEventListener('resize', () => {
  clearTimeout(_catGridResizeT);
  _catGridResizeT = setTimeout(renderHomeCatGrid, 200);
});
</script>
