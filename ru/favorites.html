<!-- Луғатҳо (fallback): сайт ҳатто аз file:// бе сервер кор мекунад -->

<script>
/* Рӯйхати дӯстдоштаҳо — ҳамаи матн аз калидҳо, аз нав сохтан ҳангоми
   иваз шудани забон (бе reload, ҳолати корбар нигоҳ дошта мешавад). */
function renderFavorites(){
  const grid = document.getElementById('fav-grid');
  const empty = document.getElementById('fav-empty');
  const countEl = document.getElementById('fav-count');
  if (!grid || !empty) return;
  const favs = getFavorites().map(id => findListing(id)).filter(Boolean);
  if (!favs.length) {
    grid.style.display = 'none';
    grid.innerHTML = '';
    empty.style.display = 'block';
    if (countEl) countEl.textContent = '';
  } else {
    grid.style.display = 'grid';
    empty.style.display = 'none';
    grid.innerHTML = favs.map(renderCard).join('');
    if (countEl) countEl.textContent = t('favorites.count', { n: formatNumber(favs.length) });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderFavorites);
} else renderFavorites();

if (window.I18N) I18N.onChange(renderFavorites);

/* Агар корбар дар ҳамин саҳифа дилро зер кунад, рӯйхатро нав мекунем */
document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('#fav-grid .fav-btn')) setTimeout(renderFavorites, 50);
});
</script>
