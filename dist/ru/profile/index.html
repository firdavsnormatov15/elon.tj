<script>
const $ = id => document.getElementById(id);
const MEMBER_SINCE = '2026';

/* Ҳолати саҳифа: табби фаъол (код, на матн) */
const state = { tab:'mine' };

const TABS = [
  { code:'mine',  icon:'package', key:'profile.tabMine' },
  { code:'favs',  icon:'heart', key:'profile.tabFavorites' },
  { code:'seen',  icon:'clock', key:'profile.tabViewed' },
];

function tabItems(code){
  if (code === 'favs') return getFavorites().map(id => findListing(id)).filter(Boolean);
  if (code === 'seen') return getRecentlyViewedListings();
  return getUserListings();
}

/* ---------------- Сарлавҳа ва статистика ---------------- */
function renderHero(){
  $('p-avatar').textContent = (t('profile.you') || '?').trim().charAt(0);
  const mine = getUserListings();
  $('p-count').innerHTML = iconHTML('package') + ' ' + t('profile.listingsN', { n: formatNumber(mine.length) });
  $('p-since').innerHTML = iconHTML('calendar') + ' ' + t('profile.since', { year: MEMBER_SINCE });
}

function renderStats(){
  const mine = getUserListings();
  const views = mine.reduce((s, l) => s + (l.views || 0), 0);
  const rows = [
    { icon:'package', key:'profile.statListings', value: mine.length },
    { icon:'heart', key:'profile.statFavorites', value: getFavorites().length },
    { icon:'message-circle', key:'profile.statUnread', value: getUnreadCount() },
    { icon:'eye', key:'profile.statViews', value: views },
  ];
  $('p-stats').innerHTML = rows.map(r => `
    <div style="display:flex;align-items:center;gap:8px;">
      ${iconHTML(r.icon)}
      <span>${t(r.key)}</span>
      <strong style="margin-left:auto;color:#0f172a;">${formatNumber(r.value)}</strong>
    </div>`).join('');
}

/* ---------------- Табҳо ---------------- */
function renderTabs(){
  $('p-tabs').innerHTML = TABS.map(tb => {
    const active = state.tab === tb.code;
    const n = tabItems(tb.code).length;
    return `<button type="button" role="tab" aria-selected="${active}" onclick="setTab('${tb.code}')"
      style="padding:10px 16px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;
      border:1px solid ${active ? '#0F7A6B' : '#e2e8f0'};
      background:${active ? 'linear-gradient(135deg,#0F7A6B,#1E8449)' : 'white'};
      color:${active ? 'white' : '#334155'};">${iconHTML(tb.icon)} ${t(tb.key)} (${formatNumber(n)})</button>`;
  }).join('');
  const cur = TABS.find(tb => tb.code === state.tab) || TABS[0];
  $('tab-heading').textContent = t(cur.key);
}

function setTab(code){
  state.tab = code;
  renderTabs();
  renderPanel();
}

/* ---------------- Панели табби фаъол ---------------- */
function emptyBlock(icon, titleKey, textKey, ctaKey, ctaHref){
  return `
    <div style="grid-column:1/-1;background:white;border-radius:16px;padding:48px;text-align:center;border:1px solid #e2e8f0;">
      <div style="font-size:44px;margin-bottom:16px;color:#94a3b8;" aria-hidden="true">${iconHTML(icon)}</div>
      <h3 style="font-size:18px;font-weight:700;color:#334155;">${t(titleKey)}</h3>
      <p style="color:#64748b;margin-top:8px;margin-bottom:24px;">${t(textKey)}</p>
      ${ctaKey ? `<a href="${ctaHref}" class="btn-primary">${t(ctaKey)}</a>` : ''}
    </div>`;
}

function renderPanel(){
  const box = $('p-panel');
  const items = tabItems(state.tab);

  if (!items.length){
    if (state.tab === 'favs') box.innerHTML = emptyBlock('heart', 'profile.emptyFavTitle', 'profile.emptyFavText', 'profile.emptyFavCta', 'search.html');
    else if (state.tab === 'seen') box.innerHTML = emptyBlock('clock', 'profile.emptySeenTitle', 'profile.emptySeenText', 'profile.emptySeenCta', 'index.html');
    else box.innerHTML = emptyBlock('package', 'profile.emptyTitle', 'profile.emptyText', 'profile.emptyCta', 'post.html');
    return;
  }

  box.innerHTML = items.map(l => {
    const canDelete = state.tab === 'mine';
    return `<div style="position:relative;">
      ${renderCard(l)}
      ${canDelete ? `<button onclick="removeMyListing('${l.id}')" title="${t('common.delete')}" aria-label="${t('common.delete')}"
        style="position:absolute;bottom:10px;right:10px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.95);border:1px solid #fecaca;color:#dc2626;cursor:pointer;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.1);"><span class="ico" data-icon="trash-2"></span></button>` : ''}
    </div>`;
  }).join('');
}

/* ---------------- Амалҳо ---------------- */
function removeMyListing(id){
  if (!confirm(t('profile.confirmDelete'))) return;
  deleteUserListing(id);
  renderPage();
}

function renderSidebarCounters(){
  const unread = getUnreadCount();
  const sb = $('sb-unread');
  sb.textContent = unread > 0 ? formatNumber(unread) : '';
  sb.style.display = unread > 0 ? 'inline-block' : 'none';
  $('sb-favcount').textContent = formatNumber(getFavorites().length);
}

/* ---------------- Render-и умумӣ ---------------- */
function renderPage(){
  renderHero();
  renderStats();
  renderTabs();
  renderPanel();
  renderSidebarCounters();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderPage);
else renderPage();

/* Иваз шудани забон — фавран, бо нигоҳ доштани табби фаъол */
I18N.onChange(renderPage);
</script>
