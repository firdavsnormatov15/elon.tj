<script>
/* ---------------- Ҳолати саҳифа (ҳангоми иваз шудани забон нигоҳ дошта мешавад) ---------------- */
const params = new URLSearchParams(location.search);
const listingId = params.get('id') || '1';
const l = findListing(listingId);
let activeImgIdx = 0;   // сурати интихобшуда дар галерея

function showToast(key, type, vars){
  const el = document.getElementById('toast');
  el.dataset.i18n = key;
  el.dataset.i18nArgs = vars ? JSON.stringify(vars) : '';
  el.textContent = t(key, vars);
  el.className = 'toast ' + (type || '');
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 2500);
}
/* Агар ҳангоми намоён будани toast забон иваз шавад — фавран тарҷума мешавад */
if (window.I18N) I18N.onChange(() => {
  const el = document.getElementById('toast');
  if (el && el.dataset.i18n && el.classList.contains('show')) {
    el.textContent = t(el.dataset.i18n, el.dataset.i18nArgs ? JSON.parse(el.dataset.i18nArgs) : undefined);
  }
});

function shareListing(){
  const url = location.href;
  if (navigator.share) {
    navigator.share({ title: displayTitle(l), url }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(url);
    showToast('ok.linkCopied', 'success');
  }
}

function paintFavButtons(){
  const active = isFavorite(l.id);
  ['fav-btn-detail','fav-btn-2','mc-fav'].forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.innerHTML = iconHTML(active ? 'heart-fill' : 'heart');
    b.classList.toggle('active', active);
    if (id === 'fav-btn-2') b.style.color = active ? '#ef4444' : '#64748b';
  });
}

function onFavToggle(){
  toggleFavorite(l.id);
  paintFavButtons();
  showToast(isFavorite(l.id) ? 'ok.favAdded' : 'ok.favRemoved');
}

/* ---------------- Галерея ---------------- */
function renderGallery(){
  const main = document.getElementById('l-img');
  const thumbs = document.getElementById('gallery-thumbs');
  if (l.images && l.images.length) {
    const url = l.images[activeImgIdx] || l.images[0];
    main.style.background = '#f1f5f9';
    main.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;" alt="${t('listing.imageAlt')}">
      <button class="gallery-fav" id="fav-btn-detail" title="${t('common.favorite')}" aria-label="${t('common.favorite')}"><span class="ico" data-icon="heart"></span></button>`;
    thumbs.innerHTML = l.images.map((u,i) => `
      <button class="thumb ${i===activeImgIdx?'active':''}" onclick="selectThumbImg(${i})" title="${t('listing.imageAlt')}" aria-label="${t('listing.imageAlt')}" style="padding:0;overflow:hidden;"><img src="${u}" style="width:100%;height:100%;object-fit:cover;" alt=""></button>
    `).join('');
  } else {
    const galleryBg = imgColors[parseInt(String(l.id).replace(/\D/g,'')||'0') % imgColors.length];
    main.style.background = galleryBg;
    main.innerHTML = `<span id="l-img-icon" aria-hidden="true">${iconHTML(catIcons[l.category] || 'package', 'ico-ph')}</span>
      <button class="gallery-fav" id="fav-btn-detail" title="${t('common.favorite')}" aria-label="${t('common.favorite')}"><span class="ico" data-icon="heart"></span></button>`;
    thumbs.innerHTML = `<button class="thumb active" aria-hidden="true" style="background:${galleryBg}">${iconHTML(catIcons[l.category]||'package', 'ico-ph')}</button>`;
  }
  document.getElementById('fav-btn-detail').onclick = onFavToggle;
}
function selectThumbImg(i){
  activeImgIdx = i;
  renderGallery();
  paintFavButtons();
}

/* ---------------- Хусусиятҳо ---------------- */
function renderAttrs(){
  const rows = [
    [t('listing.fieldCategory'), listingSubcategory(l) || getCategoryName(l.category) || '—'],
    [t('listing.fieldCondition'), listingCondition(l) || '—'],
    [t('listing.fieldCity'), listingLocation(l) || '—'],
    [t('listing.fieldId'), '#' + l.id],
  ];
  if (l.brand) rows.push([t('listing.fieldBrand'), brandLabel(l.brand)]);
  if (l.model) rows.push([t('listing.fieldModel'), l.model]);
  if (l.attrs) {
    const typeObj = getTypeEngine(l.category, l.type);
    Object.keys(l.attrs).forEach(key => {
      const val = l.attrs[key];
      if (!val) return;
      const attrDef = (typeObj && typeObj.attributes) ? typeObj.attributes.find(a => a.key === key) : null;
      rows.push([attrDef ? attrLabel(attrDef) : key, optLabel(key, val)]);
    });
  }
  document.getElementById('attrs-grid').innerHTML = rows.map(([label,val]) =>
    `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${val}</span></div>`
  ).join('');
}

/* ---------------- Render-и асосӣ ---------------- */
function renderPage(){
  if (!l) {
    document.getElementById('listing-wrap').style.display = 'none';
    document.getElementById('mobile-contact-bar').style.display = 'none';
    document.getElementById('not-found').style.display = 'block';
    document.title = t('meta.listing.title');
    return;
  }
  const heading = displayTitle(l);
  document.getElementById('l-title').textContent = heading;
  document.getElementById('crumb-title').textContent = heading;
  document.title = t('meta.listing.titleWith', { title: heading });

  const crumbCat = document.getElementById('crumb-cat');
  crumbCat.textContent = getCategoryName(l.category);
  crumbCat.href = 'category.html?slug=' + l.category;

  document.getElementById('l-loc').textContent = listingLocation(l);
  document.getElementById('l-date').textContent = formatDate(l.createdAt);
  document.getElementById('l-views').textContent = t('listing.viewsN', { n: formatNumber(l.views || 0) });
  document.getElementById('l-cond').textContent = listingCondition(l);
  document.getElementById('l-desc').textContent = listingDesc(l);
  document.getElementById('l-price').textContent = formatPrice(l.price, l.currency);
  document.getElementById('l-price-2').textContent = formatPrice(l.price, l.currency);
  document.getElementById('l-call').href = 'tel:' + (l.phone || '');
  document.getElementById('mc-call').href = 'tel:' + (l.phone || '');

  renderAttrs();

  const author = l.author || {};
  const aName = userName(author);
  document.getElementById('a-avatar').textContent = (aName || '?').charAt(0);
  document.getElementById('a-name').textContent = aName;
  document.getElementById('a-rate').textContent = formatNumber(author.rating || 0);
  document.getElementById('a-count').textContent = t('listing.adsN', { n: formatNumber(author.listingsCount || 0) });

  const msgHref = `messages.html?seller=${encodeURIComponent(author.id || aName)}&name=${encodeURIComponent(aName)}&listing=${encodeURIComponent(heading)}`;
  document.getElementById('l-message-btn').href = msgHref;
  document.getElementById('mc-msg').href = msgHref;

  renderGallery();
  paintFavButtons();
  document.getElementById('fav-btn-2').onclick = onFavToggle;
  document.getElementById('mc-fav').onclick = onFavToggle;

  const related = getRelatedListings(l, 4);
  if (related.length) {
    document.getElementById('related-wrap').style.display = 'block';
    document.getElementById('related-grid').innerHTML = related.map(renderCard).join('');
  } else {
    document.getElementById('related-wrap').style.display = 'none';
  }
}

if (l) addRecentlyViewed(l.id);
renderPage();
document.addEventListener('DOMContentLoaded', renderPage);
I18N.onChange(renderPage);
</script>
