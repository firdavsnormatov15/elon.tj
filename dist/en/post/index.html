<script>
/* ---------------- Ҳолати форма (ҳангоми иваз шудани забон нигоҳ дошта мешавад) ---------------- */
let selCategory = null;
let selType = null;
let selBrand = null;      // brandId: номи хос ('Toyota') ё калид ('brand.other')
let selModel = null;
let selAttrs = {};
let selCondition = '';    // код: new / used / good
let imgCount = 0;
let imgB64 = [];

/* ---------------- Категория ва навъ ---------------- */
function renderCatGrid(){
  document.getElementById('cat-grid').innerHTML = CATEGORY_TREE.map(c => `
    <div class="pick-tile ${selCategory===c.slug?'selected':''}" role="button" tabindex="0"
         onclick="pickCategory('${c.slug}')" title="${t(c.nameKey)}">
      <span class="pick-icon" aria-hidden="true">${iconHTML(c.icon)}</span>
      <span>${t(c.nameKey)}</span>
    </div>
  `).join('');
}

function renderTypeGrid(){
  const cat = getCatEngine(selCategory);
  const grid = document.getElementById('type-grid');
  if (!cat) { grid.innerHTML = ''; return; }
  grid.innerHTML = cat.types.map(ty => `
    <div class="pick-tile ${selType===ty.slug?'selected':''}" role="button" tabindex="0"
         onclick="pickType('${ty.slug}')" title="${t(ty.nameKey)}">
      <span>${t(ty.nameKey)}</span>
    </div>
  `).join('');
}

function pickCategory(slug){
  if (selCategory !== slug) {
    selCategory = slug; selType = null; selBrand = null; selModel = null; selAttrs = {};
  }
  renderCatGrid();
  renderTypeGrid();
  document.getElementById('block-type').style.display = 'block';
  ['block-brand','block-model','block-attrs'].forEach(id => document.getElementById(id).style.display='none');
  updatePathTrail();
  revealDetailsIfReady();
}

function pickType(slug){
  if (selType !== slug) { selType = slug; selBrand = null; selModel = null; selAttrs = {}; }
  renderTypeGrid();
  renderBrandSelect();
  renderModelSelect();
  renderAttrFields();
  updatePathTrail();
  revealDetailsIfReady();
}

/* ---------------- Бренд ва модел (value = код/номи хос, матн = тарҷума) ---------------- */
function renderBrandSelect(){
  const sel = document.getElementById('brandInput');
  const brands = selType ? getAllBrandsForType(selCategory, selType) : [];
  if (!brands.length) {
    document.getElementById('block-brand').style.display = 'none';
    sel.innerHTML = '';
    return;
  }
  document.getElementById('block-brand').style.display = 'block';
  sel.innerHTML = `<option value="">${t('ph.select')}</option>` +
    brands.map(b => `<option value="${brandId(b)}">${brandName(b)}</option>`).join('');
  sel.value = selBrand || '';
}

function renderModelSelect(){
  const sel = document.getElementById('modelInput');
  const models = (selBrand && selType) ? getModelsForBrand(selCategory, selType, selBrand) : [];
  if (!models.length) {
    document.getElementById('block-model').style.display = 'none';
    sel.innerHTML = '';
    selModel = null;
    return;
  }
  document.getElementById('block-model').style.display = 'block';
  sel.innerHTML = `<option value="">${t('ph.select')}</option>` +
    models.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.value = selModel || '';
}

document.getElementById('brandInput').addEventListener('change', function(){
  selBrand = this.value || null;
  selModel = null;
  renderModelSelect();
  updatePathTrail();
});
document.getElementById('modelInput').addEventListener('change', function(){
  selModel = this.value || null;
  updatePathTrail();
});

/* ---------------- Атрибутҳои динамикӣ ---------------- */
function renderAttrFields(){
  const typeObj = (selCategory && selType) ? getTypeEngine(selCategory, selType) : null;
  const wrap = document.getElementById('attrs-fields');
  if (!typeObj || !typeObj.attributes || !typeObj.attributes.length) {
    document.getElementById('block-attrs').style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  document.getElementById('block-attrs').style.display = 'block';
  wrap.innerHTML = typeObj.attributes.map(a => {
    const label = attrLabel(a);
    if (a.type === 'select') {
      const opts = a.options.map(code =>
        `<option value="${code}" ${selAttrs[a.key]===code?'selected':''}>${optLabel(a.key, code)}</option>`).join('');
      return `<div><label class="form-label" for="attr-${a.key}">${label}</label>
        <select id="attr-${a.key}" class="form-input attr-field" data-key="${a.key}" aria-label="${label}"
                onchange="setAttr('${a.key}', this.value)">
          <option value="">${t('ph.select')}</option>${opts}
        </select></div>`;
    }
    const val = selAttrs[a.key] ? String(selAttrs[a.key]).replace(/"/g,'&quot;') : '';
    return `<div><label class="form-label" for="attr-${a.key}">${label}</label>
      <input id="attr-${a.key}" type="${a.type==='number'?'number':'text'}" class="form-input attr-field"
             data-key="${a.key}" value="${val}" placeholder="${label}" aria-label="${label}"
             oninput="setAttr('${a.key}', this.value)"></div>`;
  }).join('');
}
function setAttr(key, value){
  if (value === '') delete selAttrs[key]; else selAttrs[key] = value;
}

/* ---------------- Ҳолат ва шаҳрҳо ---------------- */
function renderConditionSelect(){
  const sel = document.getElementById('condition');
  sel.innerHTML = `<option value="">${t('ph.select')}</option>` +
    conditionOptions().map(o => `<option value="${o.code}">${o.label}</option>`).join('');
  sel.value = selCondition || '';
}
function renderCityList(){
  document.getElementById('cities').innerHTML =
    cityOptions().map(o => `<option value="${o.label}"></option>`).join('');
}

/* ---------------- Роҳи интихоб ---------------- */
function updatePathTrail(){
  const trail = document.getElementById('path-trail');
  const parts = [];
  if (selCategory) { const c = getCatEngine(selCategory); if (c) parts.push(t(c.nameKey)); }
  if (selType) { const ty = getTypeEngine(selCategory, selType); if (ty) parts.push(t(ty.nameKey)); }
  if (selBrand) parts.push(brandLabel(selBrand));
  if (selModel) parts.push(selModel);
  if (!parts.length) { trail.style.display = 'none'; trail.innerHTML = ''; return; }
  trail.style.display = 'flex';
  trail.innerHTML = parts.map((p,i) => `<span class="seg">${p}</span>${i<parts.length-1?'<span class="sep" aria-hidden="true">›</span>':''}`).join('') +
    `<button type="button" class="change-btn" onclick="resetSelection()">${t('post.change')}</button>`;
}

function resetSelection(){
  selCategory = null; selType = null; selBrand = null; selModel = null; selAttrs = {};
  selCondition = '';
  imgCount = 0; imgB64 = [];
  renderImgGrid();
  renderCatGrid();
  renderConditionSelect();
  ['block-type','block-brand','block-model','block-attrs','block-details','block-contact'].forEach(id => document.getElementById(id).style.display='none');
  document.getElementById('btn-submit').style.display = 'none';
  updatePathTrail();
}

function revealDetailsIfReady(){
  if (selCategory && selType) {
    document.getElementById('block-details').style.display = 'block';
    document.getElementById('block-contact').style.display = 'block';
    document.getElementById('btn-submit').style.display = 'block';
  }
}

/* ---------------- Тасвирҳо (base64 — бе backend кор мекунад) ---------------- */
function renderImgGrid(){
  const g = document.getElementById('imgs');
  g.innerHTML = imgB64.map((b64,i) => `
    <div class="image-preview" data-b64="${b64}">
      <img src="${b64}" alt="${t('post.imageAlt')}"><span class="img-num">${i+1}</span>
      <button type="button" class="remove-btn" onclick="removeImg(this)" title="${t('common.delete')}" aria-label="${t('common.delete')}"><span class="ico" data-icon="x"></span></button>
    </div>`).join('') + `
    <div class="image-slot" role="button" tabindex="0" onclick="addImg()" title="${t('post.addImage')}">
      <span style="font-size:24px;" aria-hidden="true"><span class="ico" data-icon="camera"></span></span>
      <span style="font-size:12px;font-weight:500;">${t('post.addImage')}</span>
    </div>`;
}

function addImg(){
  if(imgCount >= 8){ showToast('err.maxImages', 'error', { n: 8 }); return; }
  document.getElementById('imgFileInput').click();
}

// Хурд ва фишурда кардани сурат пеш аз нигоҳдорӣ (то ҷои зиёд дар браузер нагирад)
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImgFiles(fileList){
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (imgCount >= 8) { showToast('err.maxImages', 'error', { n: 8 }); break; }
    if (!file.type.startsWith('image/')) continue;
    try {
      const b64 = await compressImage(file, 1024, 0.72);
      imgCount++;
      imgB64.push(b64);
      renderImgGrid();
    } catch (err) {
      showToast('err.imgUpload', 'error');
    }
  }
  document.getElementById('imgFileInput').value = '';
}
function removeImg(btn){
  const wrap = btn.parentElement;
  imgB64 = imgB64.filter(u => u !== wrap.dataset.b64);
  imgCount = imgB64.length;
  renderImgGrid();
}

/* ---------------- Хатоҳо ва toast ---------------- */
function showError(field){
  const el = document.getElementById(field);
  if(el){ el.classList.add('error'); el.classList.remove('success'); }
  const err = document.getElementById('err-'+field);
  if(err) err.classList.add('show');
}
function clearError(field){
  const el = document.getElementById(field);
  if(el){ el.classList.remove('error'); el.classList.add('success'); }
  const err = document.getElementById('err-'+field);
  if(err) err.classList.remove('show');
}

function showToast(key, type, vars){
  const el = document.getElementById('toast');
  el.dataset.i18n = key;                       // калид нигоҳ дошта мешавад
  el.dataset.i18nArgs = vars ? JSON.stringify(vars) : '';
  el.textContent = t(key, vars);
  el.className = 'toast ' + (type || '');
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3000);
}
/* Агар ҳангоми намоён будани toast забон иваз шавад — матн фавран тарҷума мешавад */
if (window.I18N) I18N.onChange(() => {
  const el = document.getElementById('toast');
  if (el && el.dataset.i18n && el.classList.contains('show')) {
    el.textContent = t(el.dataset.i18n, el.dataset.i18nArgs ? JSON.parse(el.dataset.i18nArgs) : undefined);
  }
});

/* ---------------- Ҳисобкунакҳо ва валидатсияи зинда ---------------- */
function renderCounters(){
  document.getElementById('title-count').textContent =
    t('post.titleCount', { n: document.getElementById('title').value.length, max: 100 });
  document.getElementById('desc-count').textContent =
    t('post.charsN', { n: document.getElementById('desc').value.length });
}

document.getElementById('title').addEventListener('input', function(){
  renderCounters();
  if(this.value.length >= 5) clearError('title');
});
document.getElementById('desc').addEventListener('input', function(){
  renderCounters();
  if(this.value.length >= 20) clearError('desc');
});
['condition','city','price','phone'].forEach(id => {
  const el = document.getElementById(id);
  if(el){ el.addEventListener('change', () => clearError(id)); el.addEventListener('input', () => clearError(id)); }
});
document.getElementById('condition').addEventListener('change', function(){ selCondition = this.value; });
document.getElementById('negotiable').addEventListener('change', function(){
  applyNegotiable();
  if (this.checked) clearError('price');
});
function applyNegotiable(){
  const price = document.getElementById('price');
  const on = document.getElementById('negotiable').checked;
  price.disabled = on;
  if (on) { price.value = ''; price.placeholder = t('common.negotiable'); }
  else { price.placeholder = '15000'; }
}

/* ---------------- Сабти эълон ---------------- */
function handleSubmit(e){
  e.preventDefault();
  let valid = true;
  if(!selCategory){ showToast('err.pickCategory', 'error'); return false; }
  if(!selType){ showToast('err.pickType', 'error'); return false; }

  const title = document.getElementById('title');
  const price = document.getElementById('price');
  const cond = document.getElementById('condition');
  const city = document.getElementById('city');
  const desc = document.getElementById('desc');
  const phone = document.getElementById('phone');
  const phoneRe = /^[+]?[0-9\s]{9,}$/;

  if(title.value.trim().length < 5){ showError('title'); valid=false; }
  if(!document.getElementById('negotiable').checked && (!price.value || price.value < 0)){ showError('price'); valid=false; }
  if(!cond.value){ showError('condition'); valid=false; }
  if(!city.value.trim()){ showError('city'); valid=false; }
  if(desc.value.trim().length < 20){ showError('desc'); valid=false; }
  if(!phoneRe.test(phone.value.trim())){ showError('phone'); valid=false; }

  if(!valid){ showToast('err.fillRequired', 'error'); return false; }

  const newId = nextListingId();
  const priceVal = document.getElementById('negotiable').checked ? 0 : (parseFloat(price.value) || 0);

  /* Матни худи корбар (унвон, тавсиф, шаҳр) тарҷума намешавад — ҳамон тавр сабт мешавад.
     Ҳолат ва асъор — кодҳо; атрибутҳо — кодҳо/рақамҳо. */
  const newListing = {
    id: newId,
    title: title.value.trim(),
    description: desc.value.trim(),
    price: priceVal,
    currency: 'somoni',
    category: selCategory,
    type: selType,
    brand: selBrand || undefined,
    model: selModel || undefined,
    attrs: Object.keys(selAttrs).length ? { ...selAttrs } : undefined,
    location: city.value.trim(),
    condition: cond.value,
    author: { id:'me', nameKey:'common.you', rating:5.0, listingsCount:getUserListings().length+1, memberSince:'2026-08-01' },
    createdAt: new Date().toISOString(),
    views: 0,
    phone: phone.value.trim(),
    images: imgB64.length ? imgB64 : undefined,
  };

  let ok = addUserListing(newListing);
  if (!ok && newListing.images) {
    // Агар аз сабаби ҳаҷми зиёди суратҳо сабт нашуда бошад — бе сурат такрор кунем
    const noImg = { ...newListing, images: undefined };
    ok = addUserListing(noImg);
    if (ok) showToast('ok.savedNoImages', 'error');
  }
  if (!ok) { showToast('err.saveFailed', 'error'); return false; }
  imgCount = 0; imgB64 = [];
  renderImgGrid();
  document.getElementById('successModal').classList.add('active');
  document.getElementById('modal-link').href = 'listing.html?id=' + newId;
  localStorage.removeItem('postDraft');
  return false;
}

/* ---------------- Драфт ---------------- */
function saveDraft(){
  const form = document.getElementById('postForm');
  const formData = new FormData(form);
  const data = {};
  for(let [k,v] of formData) data[k] = v;
  data._sel = { selCategory, selType, selBrand, selModel, selAttrs, selCondition };
  localStorage.setItem('postDraft', JSON.stringify(data));
}
function loadDraft(){
  const draft = localStorage.getItem('postDraft');
  if(!draft) return;
  try{
    const data = JSON.parse(draft);
    if (data._sel && data._sel.selCategory) {
      selCategory = data._sel.selCategory;
      selType = data._sel.selType || null;
      selBrand = data._sel.selBrand || null;
      selModel = data._sel.selModel || null;
      selAttrs = data._sel.selAttrs || {};
      selCondition = data._sel.selCondition || '';
      pickCategory(selCategory);
      if (selType) pickType(selType);
    }
    Object.keys(data).forEach(k => {
      if (k === '_sel') return;
      const el = document.querySelector('[name="'+k+'"]');
      if(el && el.type !== 'checkbox') el.value = data[k];
    });
    renderConditionSelect();
    renderCounters();
  }catch(e){}
}

/* ---------------- Render-и умумӣ + иваз шудани забон ---------------- */
function renderPage(){
  renderCatGrid();
  if (selCategory) { renderTypeGrid(); document.getElementById('block-type').style.display = 'block'; }
  renderBrandSelect();
  renderModelSelect();
  renderAttrFields();
  renderConditionSelect();
  renderCityList();
  renderImgGrid();
  renderCounters();
  applyNegotiable();
  updatePathTrail();
  revealDetailsIfReady();
}

renderPage();
setInterval(saveDraft, 8000);
window.addEventListener('load', loadDraft);
I18N.onChange(renderPage);
</script>
