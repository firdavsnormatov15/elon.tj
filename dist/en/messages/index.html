<script>
/* ---------------- Ҳолати саҳифа ---------------- */
let conversations = getConversations();
let activeConvOverride = null;
let replyToMsg = null;
let contextMsg = null;
let contextMsgIdx = -1;
let contextConvId = null;
let deleteTarget = null;

function genId(){ return 'm'+Date.now()+Math.random().toString(36).substr(2,6); }

conversations.forEach(c => {
  c.messages.forEach(m => { if(!m.id) m.id = genId(); });
});
saveConversations(conversations);

const urlParams = new URLSearchParams(location.search);
const sellerParam = urlParams.get('seller');
const nameParam = urlParams.get('name');
const listingParam = urlParams.get('listing');
if (sellerParam && nameParam) {
  let existing = conversations.find(c => convName(c) === nameParam || c.name === nameParam);
  if (!existing) {
    const palette = [['#0F7A6B','#1E8449'],['#1E8449','#FBD8BE'],['#B84A1F','#0F7A6B']];
    const colors = palette[conversations.length % palette.length];
    existing = {
      id: 'c' + Date.now(), name: nameParam, color1: colors[0], color2: colors[1],
      timeKey: 'time.now', unread: 0, online: false,
      // Матни худи корбар (унвони эълон дар дохилаш) — ҳамон тавр сабт мешавад
      messages: listingParam ? [{ id:genId(), dir:'out', text:t('messages.greeting', { title: listingParam }), time:formatTime(new Date()), date:new Date().toISOString() }] : []
    };
    conversations.unshift(existing);
    saveConversations(conversations);
  }
  activeConvOverride = existing.id;
}

let activeConv = activeConvOverride || (conversations[0] && conversations[0].id);

/* ---------------- Вақт ва сана ---------------- */
function formatTime(d){
  const h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}
function weekdayName(d){ return t('date.weekday.' + d.getDay()); }
function dayDiff(d){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((today - msgDay)/(1000*60*60*24));
}
function formatDateTime(d){
  const diff = dayDiff(d);
  const time = formatTime(d);
  if(diff === 0) return time;
  if(diff === 1) return t('time.yesterdayAt', { time });
  if(diff < 7) return t('time.dayAt', { day: weekdayName(d), time });
  return d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function dateSepLabel(d){
  const diff = dayDiff(d);
  if(diff === 0) return t('time.today');
  if(diff === 1) return t('time.yesterday');
  if(diff < 7) return weekdayName(d);
  return d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}

/* ---------------- Пешнамоиши охирин паём ---------------- */
function fileLabel(f){ return f.isImage ? (iconHTML('image') + ' ' + t('messages.image')) : (iconHTML('paperclip') + ' ' + escapeHtml(f.name)); }
function lastMsgPreview(m){
  if (!m) return t('messages.noMessages');
  if (m.file) return fileLabel(m.file);
  return msgText(m);
}

function updateNavUnread(){
  const badge = document.getElementById('nav-unread');
  if(!badge) return;
  const total = conversations.reduce((s,c)=>s+(c.unread||0),0);
  badge.textContent = total;
  badge.style.display = total > 0 ? 'flex' : 'none';
}

/* ---------------- Рӯйхати муколамаҳо ---------------- */
function renderSidebar(){
  const container = document.getElementById('conv-items');
  if(!container) return;
  if(!conversations.length){
    container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#94a3b8;">
      <div style="font-size:40px;margin-bottom:8px;" aria-hidden="true"><span class="ico" data-icon="message-circle"></span></div>
      <p style="font-weight:600;color:#334155;">${t('messages.noConversations')}</p>
      <p style="font-size:13px;margin-top:6px;">${t('messages.emptyHint')}</p>
    </div>`;
    return;
  }
  container.innerHTML = conversations.map(c => {
    const name = convName(c);
    return `
    <div class="chat-item ${c.id===activeConv?'active':''}" role="button" tabindex="0" onclick="selectConv('${c.id}')" title="${name}">
      <div class="chat-avatar"><div style="width:100%;height:100%;background:linear-gradient(135deg,${c.color1},${c.color2});display:flex;align-items:center;justify-content:center;color:white;font-weight:800;" aria-hidden="true">${(name||'?').charAt(0)}</div></div>
      <div class="chat-info">
        <div style="display:flex;justify-content:space-between;"><span class="chat-name">${name}</span><span style="font-size:12px;color:#94a3b8;">${convTime(c)}</span></div>
        <p class="chat-preview" style="${c.unread ? 'color:#0f172a;font-weight:500;' : ''}">${lastMsgPreview(c.messages[c.messages.length-1])}</p>
      </div>
      ${c.unread ? `<span class="chat-unread" title="${t('messages.unread')}">${c.unread}</span>` : ''}
    </div>`;
  }).join('');
}

/* ---------------- Чати кушода ---------------- */
function renderChat(){
  const main = document.getElementById('chat-main');
  if(!main) return;
  const c = conversations.find(x => x.id === activeConv);
  if(!c){
    main.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;padding:40px 20px;text-align:center;">
      <div style="font-size:44px;margin-bottom:10px;" aria-hidden="true"><span class="ico" data-icon="message-circle"></span></div>
      <p style="font-weight:600;color:#334155;">${t('messages.pickConversation')}</p>
    </div>`;
    return;
  }

  // Ҳолати корбар: матни нонавишта ва пешнамоиши ҷавоб нигоҳ дошта мешавад
  const oldDraft = document.getElementById('chat-draft');
  const draftText = oldDraft ? oldDraft.value : '';

  let lastDate = null;
  let html = '';
  c.messages.forEach((m, idx) => {
    const msgDate = m.date ? new Date(m.date) : new Date();
    const dateKey = msgDate.getFullYear() + '-' + msgDate.getMonth() + '-' + msgDate.getDate();
    if(lastDate !== dateKey){
      lastDate = dateKey;
      html += `<div class="chat-date-sep">${dateSepLabel(msgDate)}</div>`;
    }
    html += renderMsgBubble(m, idx);
  });
  if(!c.messages.length){
    html = `<div style="text-align:center;color:#94a3b8;padding:30px 10px;">${t('messages.noMessages')}</div>`;
  }

  const name = convName(c);
  main.innerHTML = `
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="chat-back-btn" onclick="goBackToList()" title="${t('messages.backToList')}" aria-label="${t('messages.backToList')}"><span class="ico" data-icon="arrow-left"></span></button>
        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,${c.color1},${c.color2});display:flex;align-items:center;justify-content:center;color:white;font-weight:800;flex-shrink:0;" aria-hidden="true">${(name||'?').charAt(0)}</div>
        <div>
          <div style="font-weight:700;">${name}</div>
          <div style="font-size:12px;color:${c.online ? '#10b981' : '#94a3b8'};">${c.online ? t('messages.online') : t('messages.offline')}</div>
        </div>
      </div>
      <button class="chat-call-btn" onclick="callActiveConv()" title="${t('messages.call')}" aria-label="${t('messages.call')}"><span class="ico" data-icon="phone"></span></button>
    </div>
    <div class="chat-messages" id="chat-messages">
      ${html}
      <div id="typing-indicator" class="typing-indicator" style="display:none;" aria-label="${t('messages.typing')}">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>
    <div id="reply-preview" class="reply-preview" style="display:none;">
      <div class="reply-preview-inner">
        <div class="reply-preview-text" id="reply-preview-text"></div>
        <button class="reply-preview-close" onclick="cancelReply()" title="${t('common.cancel')}" aria-label="${t('common.cancel')}"><span class="ico" data-icon="x"></span></button>
      </div>
    </div>
    <input type="file" id="chatFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt" aria-label="${t('messages.attachFile')}" onchange="handleChatFile(this.files)">
    <form class="chat-input" onsubmit="return sendMsg(event)">
      <button type="button" onclick="document.getElementById('chatFileInput').click()" style="padding:10px;border-radius:10px;background:#f8fafc;color:#94a3b8;border:none;cursor:pointer;" title="${t('messages.attachFile')}" aria-label="${t('messages.attachFile')}"><span class="ico" data-icon="paperclip"></span></button>
      <input type="text" id="chat-draft" placeholder="${t('ph.chatMsg')}" aria-label="${t('ph.chatMsg')}" autocomplete="off">
      <button type="submit" style="padding:10px;border-radius:10px;background:var(--brand);color:white;border:none;cursor:pointer;" title="${t('common.send')}" aria-label="${t('common.send')}"><span class="ico" data-icon="send"></span></button>
    </form>
  `;

  const draftInput = document.getElementById('chat-draft');
  if (draftInput && draftText) draftInput.value = draftText;
  if (replyToMsg) restoreReplyPreview();

  const box = document.getElementById('chat-messages');
  requestAnimationFrame(() => { if(box) box.scrollTop = box.scrollHeight; });
}

function renderMsgBubble(m, idx){
  let body = '';
  let replyHtml = '';

  if(m.replyTo){
    const c = conversations.find(x => x.id === activeConv);
    const orig = c.messages.find(x => x.id === m.replyTo);
    if(orig){
      const origText = orig.file ? (orig.file.isImage ? t('messages.image') : orig.file.name) : msgText(orig);
      replyHtml = `<div class="msg-reply ${m.dir==='out'?'msg-reply-out':'msg-reply-in'}"><div class="msg-reply-line"></div><div class="msg-reply-content">${escapeHtml(origText)}</div></div>`;
    }
  }

  if (m.file) {
    if (m.file.isImage) {
      body = `<a href="${m.file.url}" target="_blank" class="msg-img-link" title="${t('messages.image')}"><img src="${m.file.url}" alt="${t('messages.image')}" class="msg-img"></a>`;
    } else {
      body = `<a href="${m.file.url}" download="${m.file.name}" class="msg-file" title="${t('messages.download')}">
        <span style="font-size:22px;" aria-hidden="true"><span class="ico" data-icon="file-text"></span></span>
        <span style="font-size:13px;word-break:break-all;">${escapeHtml(m.file.name)}</span>
      </a>`;
    }
  }

  const text = msgText(m);
  const textHtml = text ? `<p class="msg-text">${escapeHtml(text)}</p>` : '';
  const statusIcon = m.dir==='out' ? (m.read ? ' <span class="ico" data-icon="check"></span><span class="ico" data-icon="check"></span>' : ' <span class="ico" data-icon="check"></span>') : '';

  return `<div class="msg msg-${m.dir}" data-msgid="${m.id}" data-idx="${idx}" oncontextmenu="showContextMenu(event,'${m.id}',${idx});return false;" ontouchstart="handleTouchStart(event,'${m.id}',${idx})" ontouchend="handleTouchEnd(event)">
    ${replyHtml}
    ${body}${textHtml}
    <div class="msg-time">${msgTime(m)}${statusIcon}</div>
  </div>`;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ---------------- Менюи контекстӣ ---------------- */
let touchTimer = null;
function handleTouchStart(e, msgId, idx){
  touchTimer = setTimeout(() => { showContextMenu(e, msgId, idx); }, 600);
}
function handleTouchEnd(e){
  if(touchTimer){ clearTimeout(touchTimer); touchTimer = null; }
}

function showContextMenu(e, msgId, idx){
  e.preventDefault();
  contextMsg = msgId;
  contextMsgIdx = idx;
  contextConvId = activeConv;
  const menu = document.getElementById('msgContextMenu');
  const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  menu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 180) + 'px';
  menu.style.display = 'block';
}

document.addEventListener('click', () => {
  const menu = document.getElementById('msgContextMenu');
  if(menu) menu.style.display = 'none';
});

function msgPlainText(m){
  return m.file ? fileLabel(m.file) : msgText(m);
}

function restoreReplyPreview(){
  const c = conversations.find(x => x.id === activeConv);
  if(!c) return;
  const m = c.messages.find(x => x.id === replyToMsg);
  const preview = document.getElementById('reply-preview');
  const el = document.getElementById('reply-preview-text');
  if(!m || !preview || !el){ replyToMsg = null; return; }
  const origText = msgPlainText(m);
  el.textContent = origText.substring(0, 60) + (origText.length > 60 ? '...' : '');
  preview.style.display = 'block';
}

function ctxReply(){
  const c = conversations.find(x => x.id === contextConvId);
  if(!c) return;
  const m = c.messages.find(x => x.id === contextMsg);
  if(!m) return;
  replyToMsg = contextMsg;
  restoreReplyPreview();
  const input = document.getElementById('chat-draft');
  if(input) input.focus();
}

function cancelReply(){
  replyToMsg = null;
  const preview = document.getElementById('reply-preview');
  if(preview) preview.style.display = 'none';
}

function ctxCopy(){
  const c = conversations.find(x => x.id === contextConvId);
  if(!c) return;
  const m = c.messages.find(x => x.id === contextMsg);
  if(!m) return;
  navigator.clipboard.writeText(msgPlainText(m)).then(() => showToast('ok.copied', 'success'));
}

function ctxForward(){
  const modal = document.getElementById('forwardModal');
  const list = document.getElementById('forwardList');
  const others = conversations.filter(c => c.id !== activeConv);
  list.innerHTML = others.map(c => {
    const name = convName(c);
    return `
    <div class="chat-item" role="button" tabindex="0" onclick="doForward('${c.id}')" style="border-radius:10px;margin-bottom:4px;" title="${name}">
      <div class="chat-avatar"><div style="width:100%;height:100%;background:linear-gradient(135deg,${c.color1},${c.color2});display:flex;align-items:center;justify-content:center;color:white;font-weight:800;" aria-hidden="true">${(name||'?').charAt(0)}</div></div>
      <div class="chat-info"><div class="chat-name">${name}</div></div>
    </div>`;
  }).join('');
  if(!others.length) list.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:20px;">${t('messages.noOtherConversations')}</div>`;
  modal.classList.add('active');
}

function doForward(targetConvId){
  const c = conversations.find(x => x.id === contextConvId);
  const target = conversations.find(x => x.id === targetConvId);
  if(!c || !target) return;
  const m = c.messages.find(x => x.id === contextMsg);
  if(!m) return;
  const now = new Date();
  const newMsg = {
    id: genId(),
    dir: 'out',
    text: m.textKey ? t(m.textKey) : (m.text || ''),
    time: formatTime(now),
    date: now.toISOString(),
    file: m.file ? JSON.parse(JSON.stringify(m.file)) : null
  };
  target.messages.push(newMsg);
  target.timeKey = 'time.now';
  saveConversations(conversations);
  closeForwardModal();
  showToast('ok.forwarded', 'success');
  renderSidebar();
}

function closeForwardModal(){
  document.getElementById('forwardModal').classList.remove('active');
}

function ctxDelete(){
  deleteTarget = { convId: contextConvId, msgId: contextMsg };
  document.getElementById('deleteModal').classList.add('active');
}
function closeDeleteModal(){
  document.getElementById('deleteModal').classList.remove('active');
  deleteTarget = null;
}
function confirmDelete(){
  if(!deleteTarget) return;
  const c = conversations.find(x => x.id === deleteTarget.convId);
  if(c){
    c.messages = c.messages.filter(m => m.id !== deleteTarget.msgId);
    saveConversations(conversations);
    renderChat();
    renderSidebar();
    showToast('ok.msgDeleted', 'success');
  }
  closeDeleteModal();
}

/* ---------------- Интихоб ва фиристодан ---------------- */
function selectConv(id){
  activeConv = id;
  const c = conversations.find(x => x.id === id);
  if(c) c.unread = 0;
  cancelReply();
  saveConversations(conversations);
  renderSidebar();
  renderChat();
  updateNavUnread();
  renderChrome();
  if (window.innerWidth < 768) { mobileShowChat = true; applyMobileView(); }
}

const AUTO_REPLY_KEYS = ['messages.autoReply.1','messages.autoReply.2','messages.autoReply.3','messages.autoReply.4','messages.autoReply.5'];

function sendMsg(e){
  e.preventDefault();
  const input = document.getElementById('chat-draft');
  const text = input.value.trim();
  if(!text) return false;
  const c = conversations.find(x => x.id === activeConv);
  if(!c) return false;
  const now = new Date();
  c.messages.push({
    id: genId(), dir:'out', text,
    time: formatTime(now), date: now.toISOString(),
    read: false, replyTo: replyToMsg || null
  });
  c.timeKey = 'time.now';
  saveConversations(conversations);
  input.value = '';
  cancelReply();
  renderChat();
  renderSidebar();

  showTyping();
  setTimeout(() => {
    hideTyping();
    const replyNow = new Date();
    // Ҷавоби намунавӣ бо КАЛИД сабт мешавад — ҳангоми иваз шудани забон тарҷума мешавад
    c.messages.push({
      id: genId(), dir:'in',
      textKey: AUTO_REPLY_KEYS[Math.floor(Math.random()*AUTO_REPLY_KEYS.length)],
      time: formatTime(replyNow), date: replyNow.toISOString()
    });
    c.timeKey = 'time.now';
    saveConversations(conversations);
    renderChat();
    renderSidebar();
  }, 2000 + Math.random()*3000);

  return false;
}

function handleChatFile(fileList){
  const files = Array.from(fileList || []);
  if (files.length === 0) return;
  const c = conversations.find(x => x.id === activeConv);
  if(!c) return;
  const now = new Date();

  files.forEach(file => {
    const url = URL.createObjectURL(file);
    c.messages.push({
      id: genId(), dir: 'out', text: '',
      time: formatTime(now), date: now.toISOString(), read: false,
      file: { name: file.name, url, isImage: file.type.startsWith('image/') }
    });
  });

  c.timeKey = 'time.now';
  saveConversations(conversations);
  renderChat();
  renderSidebar();
  document.getElementById('chatFileInput').value = '';

  showTyping();
  setTimeout(() => {
    hideTyping();
    const replyNow = new Date();
    const msg = { id: genId(), dir:'in', time: formatTime(replyNow), date: replyNow.toISOString() };
    if (files.length > 1) msg.textKey = 'messages.gotImages';
    else if (files[0].type.startsWith('image/')) msg.textKey = 'messages.gotImage';
    else msg.text = t('messages.gotFile', { name: files[0].name });
    c.messages.push(msg);
    c.timeKey = 'time.now';
    saveConversations(conversations);
    renderChat();
    renderSidebar();
  }, 2000 + Math.random()*2000);
}

function showTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.style.display = 'flex';
  const box = document.getElementById('chat-messages');
  if(box) requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}
function hideTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.style.display = 'none';
}

function showToast(key, type, vars){
  let toast = document.getElementById('chat-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'chat-toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.dataset.i18n = key;
  toast.dataset.i18nArgs = vars ? JSON.stringify(vars) : '';
  toast.textContent = t(key, vars);
  toast.className = 'toast ' + (type||'');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
/* Агар ҳангоми намоён будани toast забон иваз шавад — фавран тарҷума мешавад */
if (window.I18N) I18N.onChange(() => {
  const el = document.getElementById('chat-toast');
  if (el && el.dataset.i18n && el.classList.contains('show')) {
    el.textContent = t(el.dataset.i18n, el.dataset.i18nArgs ? JSON.parse(el.dataset.i18nArgs) : undefined);
  }
});

function callActiveConv(){
  const c = conversations.find(x => x.id === activeConv);
  if (!c) return;
  const name = convName(c);
  const u = (typeof users !== 'undefined') ? users.find(x => userName(x) === name || x.id === c.id) : null;
  if (u && u.phone) window.location.href = 'tel:' + u.phone;
  else showToast('messages.callSoon', 'success');
}

/* ---------------- Намуди мобилӣ ---------------- */
function goBackToList(){
  if (window.innerWidth < 768) { mobileShowChat = false; applyMobileView(); }
}
function toggleChatSidebar(){
  const sb = document.getElementById('chat-sidebar');
  const cm = document.getElementById('chat-main');
  if (window.innerWidth < 768) {
    // Дар мобилӣ — гузариш байни рӯйхат ва чат
    const showingList = sb && sb.style.display !== 'none';
    if (showingList) { sb.style.display='none'; if(cm) cm.style.display='flex'; }
    else { if(sb) sb.style.display='block'; if(cm) cm.style.display='none'; }
  } else if (sb) {
    sb.style.display = sb.style.display === 'none' ? 'block' : 'none';
  }
}
function applyMobileView(){
  const sb = document.getElementById('chat-sidebar');
  const cm = document.getElementById('chat-main');
  const btn = document.querySelector('.mobile-chat-toggle');
  if (window.innerWidth < 768) {
    if (mobileShowChat) {
      if (sb) sb.style.display = 'none';
      if (cm) cm.style.display = 'flex';
    } else {
      if (sb) sb.style.display = 'block';
      if (cm) cm.style.display = 'none';
    }
    if (btn) btn.style.display = 'none';
  } else {
    if (sb) sb.style.display = 'block';
    if (cm) cm.style.display = 'flex';
    if (btn) btn.style.display = 'none';
  }
}
// Дар мобилӣ: агар аз саҳифаи эълон омада бошем (seller=...), рост ба чат меравем;
// вагарна аввал РӮЙХАТИ муколамаҳо нишон дода мешавад
let mobileShowChat = !!sellerParam;

/* ---------------- Render-и умумӣ + иваз шудани забон ---------------- */
function renderPage(){
  renderSidebar();
  renderChat();
  updateNavUnread();
  applyMobileView();
}

renderPage();
window.addEventListener('resize', applyMobileView);
I18N.onChange(renderPage);
</script>
