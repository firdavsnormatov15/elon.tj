<script>
/* ---------------- Ҳолати саҳифа (state) ---------------- */
const perPage = 12;
const state = { q:'', cat:'', sub:'', city:'', cond:'', min:'', max:'', sort:'newest', page:1 };
let filteredResults = [];

const $ = id => document.getElementById(id);

/* Ҳолати ҷориро аз DOM мехонем (то ҳангоми иваз шудани забон гум нашавад) */
function readState(){
  state.q    = $('sq').value.trim();
  state.cat  = $('f-cat').value;
  state.sub  = $('f-sub').value;
  state.city = $('f-city').value;
  state.cond = $('f-condition').value;
  state.min  = $('f-min').value;
  state.max  = $('f-max').value;
  state.sort = $('sort').value || 'newest';
}

/* ---------------- Пур кардани select-ҳо (value = КОД) ---------------- */
const SORTS = [
  { code:'newest',    icon:'clock', key:'common.sortNewest' },
  { code:'cheapest',  icon:'banknote', key:'common.sortCheapest' },
  { code:'expensive', icon:'gem', key:'common.sortExpensive' },
  { code:'popular',   icon:'flame', key:'common.sortPopular' },
];

function fillSelect(el, items, selected, allLabel){
  const opts = [];
  if (allLabel !== null) opts.push(`<option value="">${allLabel}</option>`);
  items.forEach(it => {
    opts.push(`<option value="${it.code}"${it.code === selected ? ' selected' : ''}>${it.label}</option>`);
  });
  el.innerHTML = opts.join('');
  el.value = selected || '';
}

function buildSelects(){
  fillSelect($('sort'), SORTS.map(s => ({ code:s.code, label:t(s.key) })), state.sort, null);
  fillSelect($('f-cat'),
    categories.map(c => ({ code:c.slug, label:t(c.nameKey) })),
    state.cat, t('common.all'));
  updateSubFilter(true);
  fillSelect($('f-city'), cityOptions(), state.city, t('common.all'));
  fillSelect($('f-condition'), conditionOptions(), state.cond, t('common.all'));
  $('sq').value = state.q;
  $('f-min').value = state.min;
  $('f-max').value = state.max;
}

/* Зердастаҳо — навъҳои категорияи интихобшуда (value = slug-и навъ) */
function updateSubFilter(keepValue){
  if (!keepValue) readState();
  const catEng = state.cat ? getCatEngine(state.cat) : null;
  const items = catEng ? catEng.types.map(ty => ({ code:ty.slug, label:t(ty.nameKey) })) : [];
  const keep = keepValue && items.some(i => i.code === state.sub) ? state.sub : '';
  state.sub = keep;
  fillSelect($('f-sub'), items, keep, t('common.all'));
}

/* ---------------- Категорияҳо бо шумораи эълонҳо ---------------- */
function renderMainCatGrid(){
  const all = allListings();
  $('main-cat-count-grid').innerHTML = categories.map(c => {
    const n = all.filter(l => l.category === c.slug).length;
    return `<a href="category.html?slug=${c.slug}" class="subcat-count-item">${iconHTML(catIcons[c.slug] || 'package')} ${t(c.nameKey)} <span class="n">${formatNumber(n)}</span></a>`;
  }).join('');
}

/* ---------------- Навори чипҳои мобилӣ ---------------- */
function renderMobileBar(){
  const quick = ['cheapest','newest','popular'];
  $('mobile-filter-bar').innerHTML =
    `<div class="mf-chip" onclick="openFilterPanel()"><span class="ico" data-icon="sliders-horizontal"></span> ${t('common.filters')}</div>` +
    quick.map(code => {
      const s = SORTS.find(x => x.code === code);
      const active = (state.sort === code && code !== 'newest') ? ' active' : '';
      return `<div class="mf-chip${active}" id="mf-sort-${code}" onclick="quickSortSearch('${code}')">${iconHTML(s.icon)} ${t(s.key)}</div>`;
    }).join('');
}

/* ---------------- Панели филтр (off-canvas дар мобилӣ) ---------------- */
function openFilterPanel(){
  $('filters-card').classList.add('mobile-open');
  $('filter-scrim').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeFilterPanel(){
  $('filters-card').classList.remove('mobile-open');
  $('filter-scrim').classList.remove('active');
  document.body.style.overflow = '';
}

/* ---------------- Ёрирасонҳо барои филтр (бо КОДҲО) ---------------- */
function listingCityCode(l){
  if (l.cityCode) return l.cityCode;
  if (l.locationKey) {
    const found = cityCodes.find(c => l.locationKey.indexOf(c) !== -1);
    if (found) return found;
  }
  return null;
}
function matchCity(l, code){
  if (!code) return true;
  if (listingCityCode(l) === code) return true;
  const label = cityLabel(code).toLowerCase();
  return label ? listingLocation(l).toLowerCase().indexOf(label) !== -1 : false;
}
function matchQuery(l, q){
  if (!q) return true;
  const hay = [
    listingTitle(l), listingDesc(l), listingLocation(l),
    brandLabel(l.brand), l.model || '', listingSubcategory(l),
  ].join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}

/* ---------------- Филтр + сортировка ---------------- */
function filterAndSort(){
  const q = state.q.toLowerCase();
  const min = parseFloat(state.min) || 0;
  const max = parseFloat(state.max) || Infinity;

  filteredResults = allListings().filter(l => {
    if (!matchQuery(l, q)) return false;
    if (state.cat && l.category !== state.cat) return false;
    if (state.sub && l.type !== state.sub) return false;
    if (!matchCity(l, state.city)) return false;
    if (state.cond && l.condition !== state.cond) return false;
    if (l.price > 0 && (l.price < min || l.price > max)) return false;
    return true;
  });

  if (state.sort === 'cheapest') filteredResults.sort((a,b) => (a.price || Infinity) - (b.price || Infinity));
  else if (state.sort === 'expensive') filteredResults.sort((a,b) => (b.price || 0) - (a.price || 0));
  else if (state.sort === 'popular') filteredResults.sort((a,b) => (b.views || 0) - (a.views || 0));
  else filteredResults.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function applyFilters(){
  readState();
  state.page = 1;
  filterAndSort();
  renderResults();
  renderMobileBar();
}

/* ---------------- Натиҷаҳо ---------------- */
function renderResults(){
  const total = filteredResults.length;
  const pages = Math.max(1, Math.ceil(total / perPage));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * perPage;
  const pageItems = filteredResults.slice(start, start + perPage);

  $('rc').textContent = t('search.found', { n: formatNumber(total) });

  if (total === 0){
    $('grid').innerHTML = '';
    $('empty').classList.remove('hidden');
    $('pagination').innerHTML = '';
    return;
  }
  $('empty').classList.add('hidden');
  $('grid').innerHTML = pageItems.map(renderCard).join('');
  renderPagination(total);
}

function renderPagination(total){
  const pages = Math.ceil(total / perPage);
  if (pages <= 1){ $('pagination').innerHTML = ''; return; }
  const cur = state.page;
  let html = '';
  html += `<button onclick="goPage(${cur-1})" ${cur===1?'disabled':''} title="${t('common.prev')}" aria-label="${t('common.prev')}" style="padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;background:${cur===1?'#f1f5f9':'white'};color:${cur===1?'#94a3b8':'#0F7A6B'};cursor:${cur===1?'not-allowed':'pointer'};font-weight:600;"><span class="ico" data-icon="arrow-left"></span></button>`;
  for (let i = 1; i <= pages; i++){
    if (i===1 || i===pages || (i>=cur-1 && i<=cur+1)){
      html += `<button onclick="goPage(${i})" aria-label="${t('common.page', { n: i })}" style="padding:8px 14px;border-radius:10px;border:1px solid ${i===cur?'#0F7A6B':'#e2e8f0'};background:${i===cur?'linear-gradient(135deg,#0F7A6B,#1E8449)':'white'};color:${i===cur?'white':'#0F7A6B'};cursor:pointer;font-weight:600;min-width:36px;">${formatNumber(i)}</button>`;
    } else if (i===cur-2 || i===cur+2){
      html += `<span style="padding:8px;color:#94a3b8;" aria-hidden="true">...</span>`;
    }
  }
  html += `<button onclick="goPage(${cur+1})" ${cur===pages?'disabled':''} title="${t('common.next')}" aria-label="${t('common.next')}" style="padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;background:${cur===pages?'#f1f5f9':'white'};color:${cur===pages?'#94a3b8':'#0F7A6B'};cursor:${cur===pages?'not-allowed':'pointer'};font-weight:600;"><span class="ico" data-icon="arrow-right"></span></button>`;
  $('pagination').innerHTML = html;
}

function goPage(p){
  const pages = Math.ceil(filteredResults.length / perPage);
  if (p < 1 || p > pages) return;
  state.page = p;
  renderResults();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function quickSortSearch(code){
  state.sort = (state.sort === code && code !== 'newest') ? 'newest' : code;
  $('sort').value = state.sort;
  applyFilters();
}

function resetFilters(){
  state.q = ''; state.cat = ''; state.sub = ''; state.city = '';
  state.cond = ''; state.min = ''; state.max = ''; state.sort = 'newest';
  state.page = 1;
  buildSelects();
  filterAndSort();
  renderResults();
  renderMobileBar();
}

/* ---------------- Render-и умумӣ (ҳам оғоз, ҳам иваз шудани забон) ---------------- */
function renderPage(){
  buildSelects();
  renderMainCatGrid();
  renderMobileBar();
  filterAndSort();
  renderResults();
}

function initPage(){
  const p = new URLSearchParams(location.search);
  state.q = p.get('q') || '';
  const slug = p.get('slug') || p.get('cat') || '';
  if (slug && getCatEngine(slug)) state.cat = slug;
  renderPage();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPage);
else initPage();

/* Иваз шудани забон — БЕ reload, бо нигоҳ доштани филтрҳо */
I18N.onChange(() => { readState(); renderPage(); });
</script>
